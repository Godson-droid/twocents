<!doctype html>
<html>
<head><meta charset="utf-8"><title>electrum probe</title></head>
<body>
<h1>Electrum wss probe</h1>
<pre id="out">probing...</pre>
<script>
const HOSTS = [
  "wss://bch.imaginary.cash",
  "wss://electrum.imaginary.cash",
  "wss://fulcrum2.bch.ninja",
  "wss://bch.loping.net",
  "wss://electrum.cash:50004",
  "wss://bch.imaginary.cash:50004"
];
const out = document.getElementById("out");
const lines = [];
function log(s) { lines.push(s); out.textContent = lines.join("\n"); }
function probe(url) {
  return new Promise((resolve) => {
    const started = Date.now();
    let done = false;
    const finish = (msg) => { if (!done) { done = true; log(url + " => " + msg); resolve(); } };
    let ws;
    try { ws = new WebSocket(url); } catch (e) { finish("CONSTRUCT ERROR " + e.message); return; }
    const timer = setTimeout(() => { try { ws.close(); } catch (e) {} finish("TIMEOUT after " + (Date.now() - started) + "ms"); }, 12000);
    ws.onopen = () => {
      ws.send(JSON.stringify({ id: 1, method: "server.version", params: ["probe", "1.5.0"] }) + "\n");
    };
    ws.onmessage = (ev) => {
      clearTimeout(timer);
      finish("OK in " + (Date.now() - started) + "ms: " + String(ev.data).slice(0, 120));
      try { ws.close(); } catch (e) {}
    };
    ws.onerror = () => { clearTimeout(timer); finish("ERROR after " + (Date.now() - started) + "ms"); };
    ws.onclose = (ev) => { clearTimeout(timer); finish("CLOSED code " + ev.code + " after " + (Date.now() - started) + "ms"); };
  });
}
(async () => {
  for (const h of HOSTS) { await probe(h); }
  log("PROBE COMPLETE");
})();
</script>
</body>
</html>
